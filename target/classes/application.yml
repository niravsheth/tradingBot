# Safety Configuration
safety:
  trading-enabled: true
  paper-mode: false
  max-daily-loss: 1000
  max-position-value: 500
  max-open-positions: 10
  circuit-breaker:
    failure-rate-threshold: 50
    wait-duration-in-open-state: 60000
    sliding-window-size: 10

# Trading Configuration
trading:
  # Core settings
  symbol: QQQ
  total-capital: 1000
  max-position-size: 1000
  max-position-percentage: 50
  min-position-size: 0
  risk-percentage: 2.0

  # Option filtering
  min-volume: 10
  min-iv: 0.15
  max-spread-percentage: 10.0

  # Trading hours
  start-hour: 10
  start-minute: 0
  end-hour: 15
  end-minute: 30

  # Signal settings
  signal-expiration-minutes: 5
  min-volume-ratio: 1.0

  # Capital allocation by confidence
  confidence-allocation:
    high: 0.60
    medium: 0.20
    low: 0.10

  # Execution settings
  execution:
    frequency-seconds: 5
    high-priority-threshold: 0.85
    ml-threshold: 0.65
    account-value: 100000
    timeout-ms: 2000
    max-retries: 2

  # Position monitoring
  monitoring:
    frequency-seconds: 10
    check-interval-ms: 30000
    trend-update-interval: 60000
    health-check-interval: 300000

  # Trailing stop configuration
  trailing-stop:
    enabled: true
    trigger-profit: 0.30
    distance: 0.20
    activation: 0.05
    levels:
      - profit: 0.02
        stop: 0.98
      - profit: 0.05
        stop: 1.02
      - profit: 0.10
        stop: 0.75
      - profit: 0.20
        stop: 0.80
      - profit: 0.30
        stop: 0.85
      - profit: 0.50
        stop: 0.90

  # Late session rules
  late-session:
    start-time: "15:30"
    min-confidence: 0.90

  # Price movement limits
  price-movement:
    max-option-price-change: 0.15
    max-underlying-change: 0.01

  # Neutral market handling
  neutral-market:
    allow-trades: false
    allow-unusual-flow: false

  # Signal confirmation
  confirmation:
    enabled: true
    breakout-hold-candles: 2
    pullback-required: true
    volume-surge-multiplier: 1.5
    max-tracking-minutes: 5
    reversion-pullback-percent: 0.2

  # Enhanced trend detection configuration
  trend-detection:
    service-type: enhanced

    enhanced:
      enabled: true
      cache-ttl-seconds: 10

      ml:
        enabled: true
        timeout-ms: 500
        weight: 0.25
        min-confidence-to-override: 0.8

      weights:
        momentum: 0.35
        volume: 0.20
        microstructure: 0.15
        regime: 0.15
        statistical: 0.15

      base-trend:
        momentum-3min: 8
        momentum-5min: 15
        momentum-day: 25
        up-threshold: 4.0
        down-threshold: -4.0
        strong-threshold: 8.0

      statistical:
        enabled: true
        z-score-boost-threshold: 2.5
        bollinger-period: 20

      volume:
        enabled: true
        surge-threshold: 1.5
        confirmation-boost: 2.0

      microstructure:
        enabled: true
        imbalance-threshold: 0.65
        confidence-boost: 1.1

      regime:
        enabled: true
        trending-boost: 1.15
        choppy-penalty: 0.7
        high-vol-penalty: 0.85

      alerts:
        extreme-z-score: 3.0
        ml-confirmation: 0.8
        min-confidence: 0.75

    performance:
      log-detailed-analysis: true
      log-interval-seconds: 60
      track-calculation-time: true
      warn-if-slower-than-ms: 100

    fallback:
      on-ml-timeout: use-base
      on-calculation-error: neutral

  stoploss:
    atr-multiplier: 1.0
    minimum-stop-percentage: 0.50
    max-volatility-spike: 2.0
    spread-threshold: 0.15
    enable-performance-logging: true
    enable-detailed-decision-logging: true
    latency-threshold-nanos: 1000000

# TradingBot Configuration
tradingbot:
  # Thread Pool Settings
  thread-pools:
    trading-engine:
      core-size: 4
      max-size: 8
      queue-capacity: 50
      thread-prefix: "TradingEngine-"

    flow-confirmation:
      core-size: 2
      max-size: 4
      queue-capacity: 20
      thread-prefix: "FlowConfirm-"

    position-monitor:
      core-size: 2
      max-size: 4
      queue-capacity: 30
      thread-prefix: "PositionMon-"

  trading:
    market-open: "09:30"
    market-close: "16:00"
    timezone: "America/New_York"

    default-position-size: 1
    max-positions: 100
    max-position-value: 1000

    risk:
      max-daily-loss: 1000
      max-position-loss: 300
      trailing-stop-activation: 0.05
      trailing-stop-distance: 0.10

    execution-mode: INSTITUTIONAL
    max-execution-latency-ms: 500

    pre-trade:
      max-vix: 35
      min-market-breadth: 0.3
      max-daily-trades: 20
      max-position-risk: 1000

    kelly:
      fraction: 0.25
      min-trades: 20
      max-position-percentage: 5
      min-contracts: 1
      max-contracts: 20

    signal-expiration-minutes: 0.5

# Comprehensive Logging Configuration
logging:
  level:
    root: INFO
    com.tradingBot: DEBUG
    org.springframework.web: INFO
    org.hibernate: WARN
    com.tradingBot.ml: INFO
    com.tradingBot.analytics: INFO
    com.tradingBot.service.EnhancedTrendService: DEBUG
    com.tradingBot.execution: DEBUG
    com.tradingBot.risk: INFO
    com.tradingBot.signals: DEBUG
    com.zaxxer.hikari: WARN
    com.zaxxer.hikari.pool.HikariPool: WARN

  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

  file:
    # Main application log with daily rotation
    name: ./logs/tradingbot.log

  logback:
    rollingpolicy:
      # Keep 30 days of logs
      max-history: 30
      # Maximum 10GB total log files
      total-size-cap: 10GB
      # Each file max 100MB
      max-file-size: 100MB
      # Archive pattern
      file-name-pattern: ./logs/archived/tradingbot-%d{yyyy-MM-dd}.%i.log.gz

# ML Model Configuration
ml:
  models:
    lstm:
      enabled: true
      weight: 0.6
      cache-ttl-minutes: 5

    hmm:
      enabled: true
      weight: 0.4
      cache-ttl-minutes: 5

  features:
    lookback-periods: [5, 10, 20, 30]

  prediction:
    horizon-minutes: 5
    min-data-points: 10
    confidence-threshold: 0.7

# Performance Settings
performance:
  cache:
    quote-ttl-seconds: 10
    vwap-ttl-seconds: 60
    component-quote-ttl-seconds: 30

  monitoring:
    metrics-enabled: true
    slow-query-threshold-ms: 1000
    memory-threshold-mb: 512
    cpu-threshold-percent: 80

# Backup and Recovery
backup:
  database:
    enabled: true
    schedule: "0 0 2 * * ?" # Daily at 2 AM
    retention-days: 7

  logs:
    enabled: true
    schedule: "0 30 1 * * ?" # Daily at 1:30 AM
    retention-days: 30

# SSL Configuration
server:
  ssl:
    enabled: false # Set to true in production
    key-store: classpath:keystore.p12
    key-store-password: changeit
    key-store-type: PKCS12
    key-alias: tradingbot
  port: 8081

# External Services Configuration
external:
  market-data:
    timeout-ms: 5000
    retry-attempts: 3
    circuit-breaker:
      failure-threshold: 5
      recovery-timeout: 30000

  notification:
    timeout-ms: 3000
    retry-attempts: 2

# Resilience Configuration
resilience4j:
  circuitbreaker:
    instances:
      tradier-api:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30000
        sliding-window-size: 10
        minimum-number-of-calls: 5

      database:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60000
        sliding-window-size: 5

  retry:
    instances:
      api-calls:
        max-attempts: 3
        wait-duration: 1000
        retry-exceptions:
          - java.net.SocketTimeoutException
          - java.io.IOException

  timelimiter:
    instances:
      api-calls:
        timeout-duration: 5000
        cancel-running-future: true

# Application Health
health:
  checks:
    enabled: true
    database: true
    external-apis: true
    memory: true
    disk-space: true

  thresholds:
    memory-usage-percent: 85
    disk-usage-percent: 90
    response-time-ms: 1000