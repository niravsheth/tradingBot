spring:
  application:
    name: QQQTradingBot

  datasource:
    url: jdbc:postgresql://34.162.24.223:5432/postgres?sslmode=require
    username: postgres
    password: keshavamLLC2025!  # Set in environment variables
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5        # Good for GCP small tier
      minimum-idle: 1             # Lower idle to avoid consuming all connections
      connection-timeout: 20000   # 20 seconds
      idle-timeout: 60000         # 1 minute
      max-lifetime: 180000        # 3 minutes
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: false
        prepare_sql: false

  # Task Scheduling
  task:
    scheduling:
      pool:
        size: 5
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 100

